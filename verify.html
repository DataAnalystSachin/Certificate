<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Certificate Verification - Skill Course</title>
<meta name='robots' content='noindex'>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link href='https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap' rel='stylesheet'>
<style>
:root{--ink:#0f1b2d;--ink-2:#3b4a5e;--muted:#6b7a8f;--line:#e3e8ef;--bg:#f3f5f9;--card:#ffffff;--accent:#1d4ed8;--accent-2:#1e40af;--ok:#0f7b4a;--ok-bg:#e8f6ee;--bad:#b42318;--bad-bg:#fdecea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:56px 18px 40px;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;inset:0 0 auto 0;height:300px;background:linear-gradient(180deg,#e4e9f2 0%,rgba(243,245,249,0) 100%);z-index:-1}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:28px;text-align:center}
.brand img{max-height:64px;max-width:200px;object-fit:contain}
.brand .org{font-size:1.05rem;font-weight:700;letter-spacing:.2px;color:var(--ink-2)}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 32px 30px;box-shadow:0 1px 2px rgba(15,27,45,.04),0 24px 48px -28px rgba(15,27,45,.35)}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.sub{color:var(--muted);font-size:.95rem;margin-top:8px;line-height:1.5}
form{margin-top:24px;display:flex;gap:10px}
label.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{flex:1;min-width:0;font:inherit;font-size:1rem;font-weight:600;letter-spacing:.3px;color:var(--ink);padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcfe;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#9aa6b6;font-weight:500;letter-spacing:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(29,78,216,.12);background:#fff}
button{font:inherit;font-size:.98rem;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:12px;padding:0 22px;cursor:pointer;transition:background .15s}
button:hover{background:var(--accent-2)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(29,78,216,.35);outline-offset:2px}
button[disabled]{opacity:.7;cursor:wait}
.result{margin-top:22px;display:none}
.result.show{display:block;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.status{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.status svg{flex:none;width:34px;height:34px}
.status b{display:block;font-size:1.05rem;font-weight:800}
.status span{display:block;font-size:.88rem;font-weight:500;opacity:.9;margin-top:2px}
.details{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;font-size:.95rem}
.row+.row{border-top:1px solid var(--line)}
.row .k{color:var(--muted);font-weight:600;white-space:nowrap}
.row .v{font-weight:700;text-align:right;overflow-wrap:anywhere}
.view{display:block;text-align:center;margin-top:14px;padding:14px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;transition:background .15s}
.view:hover{background:#1c2c45}
.note{margin-top:12px;color:var(--muted);font-size:.85rem;line-height:1.5}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.92rem;padding:6px 2px}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{margin-top:26px;color:var(--muted);font-size:.82rem;text-align:center;line-height:1.6}
footer a{color:var(--ink-2);font-weight:600;text-decoration:none}
@media (max-width:520px){body{padding-top:36px}.card{padding:26px 20px 22px}h1{font-size:1.38rem}form{flex-direction:column}button{padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class='brand'><img src='https://dataanalystsachin.github.io/Certificate/branding/organization-logo.png?v=20261116120752' alt='Skill Course logo'><div class='org'>Skill Course</div></header>
<main class='card'>
<h1>Verify a certificate</h1>
<p class='sub'>Enter the Certificate ID printed on the certificate to check that it was issued by Skill Course.</p>
<form id='f' autocomplete='off'>
<label class='sr' for='cid'>Certificate ID</label>
<input id='cid' name='id' placeholder='e.g. CERT-2026-0001' spellcheck='false' required>
<button id='btn' type='submit'>Verify</button>
</form>
<div id='res' class='result' aria-live='polite'></div>
</main>
<footer><a href='https://xlbooster.com' rel='noopener'>https://xlbooster.com</a></footer>
<script>
(function(){
var INDEX_URL='certificates/certificate_index.csv';
var f=document.getElementById('f'),inp=document.getElementById('cid'),btn=document.getElementById('btn'),res=document.getElementById('res');
var cache=null;var ORG=(document.querySelector('.org')||{}).textContent||'the issuer';
function parseCsv(t){var rows=[],row=[],v='',q=false,i,c;t=t.replace(/^\ufeff/,'');
for(i=0;i<t.length;i++){c=t.charAt(i);
if(q){if(c==='"'){if(t.charAt(i+1)==='"'){v+='"';i++;}else{q=false;}}else{v+=c;}}
else if(c==='"'){q=true;}else if(c===','){row.push(v);v='';}
else if(c==='\n'||c==='\r'){if(c==='\r'&&t.charAt(i+1)==='\n'){i++;}row.push(v);rows.push(row);row=[];v='';}
else{v+=c;}}
if(v!==''||row.length){row.push(v);rows.push(row);}return rows;}
function norm(s){return String(s||'').replace(/\s+/g,'').toUpperCase();}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls){e.className=cls;}if(txt!=null){e.textContent=txt;}return e;}
var OK_ICON='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".14"/><path d="M12 2.5l2.2 1.6 2.7-.2.9 2.6 2.3 1.4-.6 2.6 1 2.5-2 1.8-.4 2.7-2.6.6-1.7 2.1-2.5-1-2.5 1-1.7-2.1-2.6-.6-.4-2.7-2-1.8 1-2.5-.6-2.6 2.3-1.4.9-2.6 2.7.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8.2 12.3l2.5 2.5 5.1-5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var BAD_ICON='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".14"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M9 9l6 6M15 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function show(node){res.innerHTML='';res.appendChild(node);res.className='result show';}
function status(kind,title,text){var s=el('div','status '+kind);s.innerHTML=kind==='ok'?OK_ICON:BAD_ICON;var d=el('div');d.appendChild(el('b',null,title));d.appendChild(el('span',null,text));s.appendChild(d);return s;}
function row(k,v){var r=el('div','row');r.appendChild(el('span','k',k));r.appendChild(el('span','v',v));return r;}
function load(){if(cache){return Promise.resolve(cache);}
return fetch(INDEX_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(r.status===404){return '';}if(!r.ok){throw new Error('HTTP '+r.status);}return r.text();}).then(function(t){cache=parseCsv(t);return cache;});}
function verify(raw){var id=norm(raw);if(!id){return;}
btn.disabled=true;var l=el('div','loading');l.appendChild(el('div','spin'));l.appendChild(el('span',null,'Checking records...'));show(l);
load().then(function(rows){var hit=null,i;for(i=1;i<rows.length;i++){if(rows[i].length>=1&&norm(rows[i][0])===id){hit=rows[i];break;}}
var box=el('div');
if(hit){box.appendChild(status('ok','Verified certificate','This certificate is genuine and was issued by '+ORG+'.'));
var d=el('div','details');d.appendChild(row('Awarded to',hit[1]||'-'));d.appendChild(row('Certificate ID',hit[0]));box.appendChild(d);
if(hit[2]&&/^https?:\/\//i.test(hit[2])){var a=el('a','view','View certificate');a.href=hit[2];box.appendChild(a);}}
else{box.appendChild(status('bad','No certificate found','No certificate with the ID "'+String(raw).trim()+'" exists in our records.'));
box.appendChild(el('p','note','Check the ID for typing mistakes and try again. A certificate issued in the last few minutes may take a short while to appear here.'));}
show(box);history.replaceState(null,'','?id='+encodeURIComponent(String(raw).trim()));})
.catch(function(){var box=el('div');box.appendChild(status('bad','Could not check right now','The verification records could not be loaded. Please check your internet connection and try again.'));show(box);})
.then(function(){btn.disabled=false;});}
f.addEventListener('submit',function(e){e.preventDefault();verify(inp.value);});
var q=new URLSearchParams(location.search).get('id');if(q){inp.value=q;verify(q);}else{inp.focus();}
})();
</script>
</body>
</html>
